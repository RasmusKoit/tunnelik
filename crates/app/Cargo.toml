[package]
name = "tunnelik-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Tunnelik's window: add, edit and connect tunnels"

[[bin]]
name = "tunnelik-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
tunnelik-manage = { path = "../manage" }

[features]
# Serves the bundled UI instead of a dev server; `cargo build` needs it on.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
