[package]
name = "wgw11-host"
version = "0.1.0"
edition.workspace = true
description = "Process Windows starts to run the VPN plugin"

[[bin]]
name = "wgw11_host"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
wgw11-plugin = { path = "../plugin" }
windows-core = "0.62"
windows = { version = "0.62", features = ["ApplicationModel_Core", "Foundation"] }
