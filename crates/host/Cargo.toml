[package]
name = "tunnelik-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Process Windows starts to run the VPN plugin"

[[bin]]
name = "tunnelik_host"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
tunnelik-plugin = { path = "../plugin" }
windows-core = "0.100"
windows = { version = "0.62", features = ["ApplicationModel_Core", "Foundation", "Win32_System_WinRT"] }
