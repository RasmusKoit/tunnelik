[package]
name = "tunnelik-manage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Adds, removes, connects and lists tunnels; shared by the tunnelik command and the app"

[dependencies]
wgconf = { path = "../wgconf" }
tunnelik-plugin = { path = "../plugin" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.100"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "ApplicationModel_Background",
    "Foundation",
    "Networking_Vpn",
    "Storage",
    "Storage_Search",
    "Win32_Foundation",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }
