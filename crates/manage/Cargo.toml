[package]
name = "tunnelik-manage"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Adds, removes, connects and lists tunnels; shared by the tunnelik command and the app"

[dependencies]
wgconf = { path = "../wgconf" }
tunnelik-plugin = { path = "../plugin" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Storage",
    "Storage_Search",
    "Win32_Foundation",
    "Win32_NetworkManagement_Rras",
] }
