[package]
name = "tunnelik-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Windows VPN plugin that carries WireGuard tunnels"

[lib]
name = "tunnelik_plugin"
# cdylib is what Windows loads; rlib lets the tests link against the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
wgconf = { path = "../wgconf" }
boringtun = { git = "https://github.com/RasmusKoit/wiresock-boringtun", rev = "88645eb5ac898974a9c9c9058dc980f9e69984ce", default-features = false }
getrandom = "0.4"

[dev-dependencies]
# The tests advance the engine's clock by hand to reach its handshake retries.
boringtun = { git = "https://github.com/RasmusKoit/wiresock-boringtun", rev = "88645eb5ac898974a9c9c9058dc980f9e69984ce", default-features = false, features = ["mock-instant"] }
mock_instant = "0.6"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "ApplicationModel_Background",
    "Data_Xml_Dom",
    "Foundation_Collections",
    "Networking",
    "Networking_Connectivity",
    "Networking_Sockets",
    "Networking_Vpn",
    "Security_Cryptography_DataProtection",
    "Storage",
    "Storage_Search",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
